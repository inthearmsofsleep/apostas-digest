<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Múltiplas +EV · login</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f1f5f9; color:#0f172a;
      font-family: Georgia, "Times New Roman", serif; }
    form { width:min(100%, 360px); margin:24px; padding:28px 24px; background:#fff; border:1px solid #dbe3ee;
      border-radius:16px; box-shadow:0 10px 30px rgba(15,23,42,.06); }
    h1 { margin:0 0 6px; font-size:1.45rem; }
    p { margin:0 0 18px; color:#64748b; font-size:.95rem; line-height:1.45; }
    label { display:block; font-size:.85rem; color:#475569; margin:0 0 6px; }
    input { width:100%; box-sizing:border-box; margin:0 0 14px; padding:10px 12px; border:1px solid #cbd5e1;
      border-radius:10px; font:inherit; font-size:1rem; }
    button { width:100%; border:0; border-radius:10px; padding:11px 14px; background:#059669; color:#fff;
      font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.65; cursor:wait; }
    .err { color:#b91c1c; font-size:.9rem; min-height:1.2em; margin:0 0 10px; }
    .hint { margin-top:14px; font-size:.78rem; color:#94a3b8; }
  </style>
</head>
<body>
  <form id="login" autocomplete="current-password">
    <h1>Múltiplas +EV</h1>
    <p>Área reservada. Entra com o utilizador e a password que te foram dados.</p>
    <div class="err" id="err" aria-live="polite"></div>
    <label for="user">Utilizador</label>
    <input id="user" name="username" autocomplete="username" required />
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="go">Entrar</button>
    <p class="hint">Contas: fcp. A sessão fica neste browser até fechares o separador.</p>
  </form>
  <script>

  var SEALED = JSON.parse('{"v":1,"iterations":120000,"contentIv":"KPy1J8Cq/KVadUmr","contentTag":"TUpgZeUfZQvYkmArYwQOZA==","ciphertext":"casFNpjCq7otOjsj7HKDishxHxi60Dcdp+Euch5aN3mA1tYIRWG4/LscJmmwr0ua6xk+cmn0Fjlu+8/I01wevAIsiY6flslxTJo+lOZlyiD4CfyVbm3+i5LqL34T6Pgo+jy40nqeOveqaPHPNu3pzkN5d8fCPFFPHQ8t4Pt0QpM52/tZfiDVupcLlhVt1AvDq1l6SQYxQbQb2EJ4xdzkK6FNYWezhnY5nOg4lWYKMiSt8NyLp/ppeMvuArAY9yuu6SyXD1CsYMO63wNwQMx5kt/24+IKe5jlUrKyOXdIetKrLTRkchg0SEt3FO9GztUJNgMWvoUNL394t15GpQFJz4+3isOqHM2v4NQCdW1CdZFAs+CTVO/LnrXfUucPmAv8dQfwonj7YqIDkoDOXJDScofqim78pPakEmYPfWtz/MNuwOd1tYJHJliJwRQHR6g52m68Z9oKck5AyRd/VtXy6zZiNXS4zDtvcyYtIg9MhFtGD51NrLvt9voloWalU3i/lf1q8yLiLFsFqz2hUe8Erqed6NtxXCn6RiKv05+yaQSaxyRlihwTHwWNlJQWW1uQBkHTQP61lPx012alzKqLRY1ZJVN87qNlKsT5t/nRSiIvBgwPQQq6Hf6BNNzz4K5D+4xbfy9ZlIBl9Osm4Wye3NhMHDwYI71yV+YD+YP0XSaklTThewgTwwB8vIrx06Lru4tnVxPBtV3dBBB0q1TRFk7b79S4qhyoi7g5a5F8gLQTBCAVCIRxf5D8I/kAfBRSJPpngOAa76vYcl7vf3wFcA7yW8gVvPs/Et/gAIQkh/mQf6rzTu5nODajctkTLBDf1vLd2TOd7oPE8aoE551xgxqXxQHA9blQCv75YwT/euBjvEJs0IIZpIUHp1Xgo053TbQx17ip9ef93uxYlo2LLOsSHByK3bO2zZfqV+Geiw0+eERss6b5uX0QmtIpqmtueekuN8qzgUWjN+lll7tmUr/fzPSFkNPy4GQmmVmHgfOMeXR+LmJeRU8ycVneY/1K6/qxnOvEQ8wY21f0KPLLb3+MmgCuUtYy9DmjKYY2Qrv+JdCAPzuQOiDhqzdrQgfAsKTXdnhlYR2GJAPZ0Uyja9qjdg8EXiKBGDFHszGqTlOtQFbwxpYluP3t9I7Xrbsd9qdT2GOBFu9e1iAOfIusBOPFuRq5Givh+tS7VpnsZaIBVU0FNhe/4yOsoEVcO2+UquvJkHneubVjUEQsl/QidAUplqBzglspMjYO0qbl1ioPXEghfxN4qeTkpDhmg7I+hHMXWSL5GGOqzxorDHXbRe++CWTUJ110odJn5mSpZzdI0lgT/Wr3lcXMMKe4ThOcBLb6VNTXaKSHBc82xqe71vFefW6GaxjEQdupnepW8VxugGsbvWA/+dVBjmhcnbfx7AhzRCMRm/gDa8HT3f7jlsqRXGnFwjnhR4YRPvYmKCTkeSWSG3UthdSKCab9Y20D+lb7PxG87GKauOM3iNm3bseOMUs1iy2UbzLBUMOnnYSDN1jh8tu1g2NyHQVvynutpxQFPc8SaM/WL+NuDIC2T7VnqKGpkQNG6/uDvzO0qAObN6oY7/zcgRTzeFETxCftdVhwMpNH6FYhu92238W7Idd/yXVwDZ/k6S/3ftyOU6VZG0T6QjYWDoVqKZUJZ4F3JBkvUdLmVVYdwpKQ+Rd57OG2Knr1NzPXMVb0zmN4MqfFCsvtauOLfny8vtBAzxSWePgmkSeplsV6+xJFRcsqKwO9p7C3ZCu6yv7JxW08klKMfk70fQU858uIufGNFNi8ZKC0JWbeq+d/aEMNRUWDbrNlnh48QnZB6/71sgtpq5tn0aII6GM0xU/nMKhjU+W4BS3KtY8eBbAO7gLKqvjr83KzZVYZWBM7VwHn1In0aMeVIyfa/9Nl8S+NEsRua5QXjzDMDWwGVw+pPyYsZMY/d5P2i/wWw387kNDtmqpznqiHg0lRnjQPvCht+SPvMlZOKGSKS3d3mGzenUN63obGKo+s/nL2fo41wphQagbOXhg17sOYY9UEUNGKQlzUCf48RlxxOdAMa3/A0JkdWxv4tZozOMkO3YtB9e+jIvSqZ3onwexMa0kNHlaVm58QOBNk+RzGjIHb4rDk/V1f6yMxsI4qJt0ztgkQloLBD13OmGwuhDNQ","users":[{"user":"fcp","salt":"EkmfIGja3wkC3C8CGF/0XQ==","iv":"lhyM5fH8fx9t4mNm","tag":"bbwPKP+PRRXO3JMV1xciOQ==","wrappedKey":"rkOX50rrQLt6emsubL3Z6GSiVVaU/Qvo38rCEKzbsTU="}]}');
  var SESSION_KEY = 'mev-digest-auth-v1';

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function bytesToUtf8(bytes) {
    return new TextDecoder().decode(bytes);
  }

  async function deriveKey(password, salt, iterations) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decryptAesGcm(key, iv, tag, ciphertext) {
    var data = new Uint8Array(ciphertext.length + tag.length);
    data.set(ciphertext, 0);
    data.set(tag, ciphertext.length);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
    return new Uint8Array(plain);
  }

  async function unlock(user, password) {
    var slot = null;
    for (var i = 0; i < SEALED.users.length; i++) {
      if (SEALED.users[i].user === user) { slot = SEALED.users[i]; break; }
    }
    if (!slot) throw new Error('Utilizador ou password incorrectos.');
    var wrapKey = await deriveKey(user + ':' + password, b64ToBytes(slot.salt), SEALED.iterations);
    var contentKeyBytes = await decryptAesGcm(
      wrapKey,
      b64ToBytes(slot.iv),
      b64ToBytes(slot.tag),
      b64ToBytes(slot.wrappedKey)
    );
    var contentKey = await crypto.subtle.importKey('raw', contentKeyBytes, 'AES-GCM', false, ['decrypt']);
    var htmlBytes = await decryptAesGcm(
      contentKey,
      b64ToBytes(SEALED.contentIv),
      b64ToBytes(SEALED.contentTag),
      b64ToBytes(SEALED.ciphertext)
    );
    return bytesToUtf8(htmlBytes);
  }

  function showHtml(html) {
    document.open();
    document.write(html);
    document.close();
  }

  async function trySession() {
    try {
      var saved = sessionStorage.getItem(SESSION_KEY);
      if (!saved) return;
      var parsed = JSON.parse(saved);
      if (!parsed || !parsed.u || !parsed.p) return;
      var html = await unlock(parsed.u, parsed.p);
      showHtml(html);
    } catch (e) {
      sessionStorage.removeItem(SESSION_KEY);
    }
  }

  document.getElementById('login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var err = document.getElementById('err');
    var btn = document.getElementById('go');
    var user = document.getElementById('user').value.trim();
    var pass = document.getElementById('pass').value;
    err.textContent = '';
    btn.disabled = true;
    try {
      var html = await unlock(user, pass);
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ u: user, p: pass }));
      showHtml(html);
    } catch (e) {
      err.textContent = 'Utilizador ou password incorrectos.';
      btn.disabled = false;
    }
  });

  trySession();
})();
  </script>
</body>
</html>
